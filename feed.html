<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Design Hub | Global Feed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; color: #e5e5e5; font-family: 'Courier New', Courier, monospace; }
        .neon-border { border: 1px solid #00FF00; box-shadow: 0 0 10px rgba(0, 255, 0, 0.1); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center">

    <nav class="w-full border-b border-[#00FF00] bg-[#0a0a0a] p-4 flex justify-between items-center shadow-[0_0_10px_rgba(0,255,0,0.2)] mb-10">
        <div class="flex items-center gap-2">
            <span class="text-xl font-extrabold text-[#00FF00] border border-[#00FF00] px-2 rounded">DH</span>
            <span class="font-bold text-white">Global Feed</span>
        </div>
        <div class="flex gap-4">
            <a href="analyze.html" class="bg-[#00FF00] text-black px-4 font-bold rounded hover:bg-white transition flex items-center justify-center">+ UPLOAD</a>
            <a href="profile.html" class="text-gray-400 hover:text-[#00FF00] font-bold flex items-center">My Portfolio</a>
            <button onclick="localStorage.clear(); window.location.href='landing.html'" class="text-red-500 font-bold flex items-center">Logout</button>
        </div>
    </nav>

    <div class="w-full max-w-4xl px-6">
        <h1 class="text-3xl font-bold text-[#00FF00] mb-6 border-b border-gray-800 pb-2">Open Source Hardware</h1>
        
        <!-- Search Bar -->
        <div class="mb-8 flex gap-4">
            <input type="text" id="searchInput" placeholder="Search by model name or username..." class="w-full px-4 py-3 bg-[#111] border border-gray-700 text-white rounded focus:border-[#00FF00] outline-none transition">
            <button onclick="performSearch()" class="px-8 py-3 bg-[#00FF00] text-black font-bold rounded hover:bg-white shadow-[0_0_15px_rgba(0,255,0,0.3)] transition">Search</button>
            <button onclick="loadFeed()" class="px-6 py-3 border border-gray-600 text-gray-400 rounded hover:text-white font-bold transition">Reset</button>
        </div>

        <div id="feedContainer" class="space-y-6">
            <p class="text-gray-500 text-center py-10">Fetching global repositories...</p>
        </div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000";
        if (!localStorage.getItem('access_token')) window.location.href = 'auth.html';

        function renderModels(models) {
            const container = document.getElementById('feedContainer');
            container.innerHTML = "";

            if (models.length === 0) {
                container.innerHTML = `<p class="text-gray-500 text-center py-10">No models found matching that query.</p>`;
                return;
            }

            models.forEach(model => {
                container.innerHTML += `
                    <div class="neon-border bg-[#0a0a0a] rounded-lg p-6 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 hover:shadow-[0_0_15px_rgba(0,255,0,0.3)] transition">
                        <div class="flex-1">
                            <h2 class="text-2xl font-bold text-white">${model.title}</h2>
                            <p class="text-sm text-gray-500 mb-2">Uploaded by <a href="public_profile.html?user=${encodeURIComponent(model.owner_name)}" class="text-[#00FF00] hover:underline font-bold">@${model.owner_name}</a> | Vol: ${model.volume_mm3} mm³</p>
                            <p class="text-gray-400 text-sm mb-4">${model.description}</p>
                            <span class="px-2 py-1 bg-gray-900 border border-yellow-500 text-yellow-500 text-xs rounded font-bold">${model.status}</span>
                        </div>
                        <div class="flex flex-col gap-2 min-w-[140px]">
                            <button onclick="window.location.href='detail.html?id=${model.id}'" class="px-4 py-2 bg-gray-800 text-white font-bold rounded hover:bg-gray-700 text-sm text-center transition">View 3D Model</button>
                            <button onclick="window.location.href='${API_URL}/api/download/${model.id}'" class="px-4 py-2 bg-[#00FF00] text-black font-bold rounded hover:bg-white text-sm text-center shadow-[0_0_10px_rgba(0,255,0,0.3)] transition">Download .STL</button>
                            <button onclick="navigator.clipboard.writeText('${window.location.origin}/detail.html?id=${model.id}'); alert('Shareable Link Copied!')" class="px-4 py-2 border border-gray-600 text-gray-400 rounded hover:text-white font-bold text-sm text-center transition">Copy Link</button>
                        </div>
                    </div>
                `;
            });
        }

        async function loadFeed() {
            document.getElementById('searchInput').value = "";
            try {
                const response = await fetch(`${API_URL}/api/feed`);
                const data = await response.json();
                renderModels(data.models);
            } catch (err) {
                document.getElementById('feedContainer').innerHTML = "<p class='text-red-500'>Failed to connect to server.</p>";
            }
        }

        async function performSearch() {
            const query = document.getElementById('searchInput').value;
            if (!query) return loadFeed();
            
            try {
                const response = await fetch(`${API_URL}/api/search?q=${encodeURIComponent(query)}`);
                const data = await response.json();
                renderModels(data.models);
            } catch (err) {
                document.getElementById('feedContainer').innerHTML = "<p class='text-red-500'>Search request failed.</p>";
            }
        }

        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') performSearch();
        });

        loadFeed();
    </script>
</body>
</html>
